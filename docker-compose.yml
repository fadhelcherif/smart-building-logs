services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: sb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - smartbuilding-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30


  es-setup:
    image: curlimages/curl:8.10.1
    container_name: sb-es-setup
    volumes:
      - ./elasticsearch:/setup:ro
    networks:
      - smartbuilding-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        curl -sf -X PUT http://elasticsearch:9200/_ilm/policy/sensor-logs-policy
        -H "Content-Type: application/json" --data-binary @/setup/ilm-policy.json &&
        curl -sf -X PUT http://elasticsearch:9200/_index_template/sensor-logs
        -H "Content-Type: application/json" --data-binary @/setup/index-template.json &&
        echo " Elasticsearch configure"
    restart: "no"
    

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: sb-logstash
    environment:
      - XPACK_MONITORING_ENABLED=false
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./uploads:/usr/share/logstash/uploads
    networks:
      - smartbuilding-net
    depends_on:
      es-setup:
        condition: service_completed_successfully

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: sb-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - smartbuilding-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: sb-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - smartbuilding-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: sb-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - smartbuilding-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  flask:
    build: ./app
    container_name: sb-flask
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - smartbuilding-net
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  smartbuilding-net:

volumes:
  es-data:
  mongo-data:
  redis-data: