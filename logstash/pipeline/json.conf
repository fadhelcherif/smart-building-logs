input {
  file {
    path => "/usr/share/logstash/uploads/*.json"
    mode => "read"
    codec => "json"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_json.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  fingerprint {
    source => ["sensor_id", "timestamp"]
    concatenate_sources => true
    method => "SHA1"
    target => "event_id"
  }

  dissect {
    mapping => { "sensor_id" => "%{?kind}-%{?zone_code}-%{room}" }
  }

  translate {
    source => "zone"
    target => "floor"
    dictionary => { "SS" => "-1" "E0" => "0" "E1" => "1" "E2" => "2" "E3" => "3" }
  }

  mutate { copy => { "[log][file][path]" => "source_file" } }
  mutate { gsub => ["source_file", "^.*/", ""] }

  mutate {
    convert => { "value" => "float" "floor" => "integer" }
    remove_field => ["timestamp", "event", "log", "host"]
  }
}

output {
  if "_jsonparsefailure" in [tags] or "_dateparsefailure" in [tags] or "_dissectfailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ingest-errors-%{+YYYY.MM}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "sensor-logs-%{+YYYY.MM}"
      document_id => "%{event_id}"
    }
  }
}