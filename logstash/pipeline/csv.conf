input {
  file {
    path => "/usr/share/logstash/uploads/*.csv"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}

filter {
  csv {
    skip_header => true
    columns => ["timestamp", "sensor_id", "zone", "type", "value", "unit", "level", "message"]
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    convert => { "value" => "float" }
    remove_field => ["timestamp", "event", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sensor-logs-%{+YYYY.MM}"
  }
}