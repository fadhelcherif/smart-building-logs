input {
  file {
    path => "/usr/share/logstash/uploads/*.csv"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}

filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["timestamp", "sensor_id", "zone", "type", "value", "unit", "level", "message"]
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Fixed ID: same sensor + same time = same document (no duplicates)
  fingerprint {
    source => ["sensor_id", "timestamp"]
    concatenate_sources => true
    method => "SHA1"
    target => "event_id"
  }

  # Room from the sensor ID: TEMP-E2-S204 -> S204
  dissect {
    mapping => { "sensor_id" => "%{?kind}-%{?zone_code}-%{room}" }
  }

  # Floor from the zone
  translate {
    source => "zone"
    target => "floor"
    dictionary => { "SS" => "-1" "E0" => "0" "E1" => "1" "E2" => "2" "E3" => "3" }
  }

  # File name only (without the folder path)
  mutate { copy => { "[log][file][path]" => "source_file" } }
  mutate { gsub => ["source_file", "^.*/", ""] }

  mutate {
    convert => { "value" => "float" "floor" => "integer" }
    remove_field => ["timestamp", "event", "log", "host"]
  }
}

output {
  if "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] or "_dissectfailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ingest-errors-%{+YYYY.MM}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "sensor-logs-%{+YYYY.MM}"
      document_id => "%{event_id}"
    }
  }
}