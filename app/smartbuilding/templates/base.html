<!doctype html>
<html lang="fr">
{% block head %}{% endblock %}
<head>
  <meta charset="utf-8">
  <title>Smart Building</title>
  <style>
        #drop-zone { display: block; border: 2px dashed #9aa8b8; border-radius: 8px; padding: 40px; text-align: center; color: #555; cursor: pointer; margin-bottom: 12px; }
    #drop-zone.over { background: #e7f1fb; border-color: #1f3a5f; }
    progress { width: 100%; height: 18px; }
    td progress { width: 120px; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    nav { background: #1f3a5f; padding: 12px 24px; }
    nav a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: 600; }
    main { max-width: 1000px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #eef1f5; }
    .error { background: #fbebeb; color: #9b1c1c; padding: 10px; border-radius: 6px; }
    .ok { background: #e5f4e4; color: #1d5c1a; padding: 10px; border-radius: 6px; }
    button { background: #1f3a5f; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #888; }
    .badge { color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #888; }
    .badge.CRITICAL { background: #c62828; }
    .badge.WARNING { background: #ef8100; }
    .badge.ERROR { background: #7b3fa0; }
    .badge.INFO { background: #888; }
    .choices label { margin-right: 12px; }
    .source.cache { color: #1d5c1a; font-weight: 600; }
    .source.live { color: #1f3a5f; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('uploads.upload') }}">Importer</a>
    <a href="{{ url_for('uploads.files') }}">Fichiers importés</a>
    <a href="{{ url_for('search.search') }}">Recherche</a>
    <a href="{{ url_for('search.history') }}">Historique</a>
    <a href="{{ url_for('api_docs.docs') }}">API</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
